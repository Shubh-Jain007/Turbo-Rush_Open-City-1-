<style>

*{box-sizing:border-box}

function rulesBody(){return`<details open><summary>The goal</summary><p>Drive around the city and finish jobs. Jobs give you cash. Use cash to buy cars, parts and upgrades. Finish all 3 jobs in a stage to unlock the next one. Stages repeat every 20 in a new world with harder jobs — there is no end.</p></details>
<details><summary>How to drive</summary><p>Arrow keys or W A S D to drive. Space = drift. Shift = boost. C or Ctrl = handbrake. H = horn. R = reset camera. + / − = zoom. F = full screen. M = music. N = sound. P / Esc = pause. Tab = settings. Drag to turn the view. On a phone, use the on-screen buttons.</p></details>
<details><summary>Jobs</summary><ul><li>Deliver the package: pick it up, then take it to the end point.</li><li>Taxi ride: pick up your passenger and drop them off.</li><li>Race: drive through every checkpoint.</li><li>Cash grab: pick up all the cash.</li><li>Follow the car: stay close to the red car.</li><li>Catch the car: chase the red car and stay right behind it.</li><li>Parking test: drive into the green circle and stop.</li></ul></details>
<details><summary>Team game</summary><p>You can play a team game when there are more than 2 players and the number of players is even. Blue and Red teams are the same size. Pick up the most cash in 5 minutes to win.</p></details>
<details><summary>AI players</summary><p>You can add 0, 1 or 2 AI players. In races they are your rivals. In a team game they join a team to keep it even.</p></details>
<details><summary>Cars, looks and upgrades</summary><p>New cars open up as you clear stages. Buy them in the Garage. Pick your face from 24 avatars, colours, patterns and parts. Use the Upgrades tab to boost Engine, Handling, Armor and Nitro — these change real driving stats. Tap the heart to save favourite looks.</p></details>
<details><summary>Scores and sound</summary><p>Every job gives you points. See your best runs in Scores. You can change the sound and music in Settings. Easy mode makes crashes gentler and gives you more time.</p></details>
<details><summary>Playing with friends</summary><ol><li>Everyone opens the game on their own device.</li><li>One player picks Host a room and shares the 4-digit code.</li><li>Friends pick Join a room and type the code.</li><li>The host starts the game. Up to 10 players can join. Everyone needs internet.</li></ol></details>`}

<div class="set" style="display:block"><b>Profile</b><div class="row" style="margin:8px 0"><span class="av on" style="display:grid;place-items:center">${AV[SV.sel.a]}</span><input id="pn" maxlength="12" value="${esc(SV.name)}" oninput="SV.name=this.value;save()" style="flex:1;width:auto" aria-label="Driver name"></div><div class="row">${AV.map((a,i)=>`<button class="av ${SV.sel.a==i?'on':''}" onclick="SV.sel.a=${i};save();render()">${a}</button>`).join('')}</div><p class="mut">Cash $${SV.coins} · Stage ${SV.stage} unlocked · ${VEH.find(v=>v.id==SV.sel.v).n}</p><p class="mut">${CL?'Cloud save: on':'Cloud save: off (it turns on when the game is hosted online and you are signed in)'}</p><div class="row"><button class="btn sm" onclick="save();cloudSave(0);toast(CL?'Profile saved online':'Profile saved on this device')">${ic('star')} Save profile</button><button class="btn sm" onclick="showSet=false;view='garage';render()">${ic('car')} Garage</button><button class="btn sm ghost" onclick="if(confirm('Reset all progress?')){try{localStorage.removeItem('turborush3')}catch(e){}location.reload()}">Reset progress</button></div></div>
<div class="set" style="display:block">Theme<div class="tl">${Object.entries(THEMES).map(([k,[n,c]])=>`<button class="tb ${SV.theme==k?'on':''}" onclick="SV.theme='${k}';save();render()"><span style="background:linear-gradient(90deg,#000 50%,${c} 50%)"></span>${n}${k=='blue'?'<em>Favourite</em>':''}</button>`).join('')}</div></div>
<div class="set">Sound effects${tg('sound')}</div><div class="set">Sound volume<input type="range" min="0" max="1" step=".05" value="${SV.svol}" oninput="SV.svol=+this.value;save()" style="width:140px" aria-label="Sound volume"></div><div class="set">Background music${tg('music')}</div><div class="set">Music volume<input type="range" min="0" max="1" step=".05" value="${SV.mvol}" oninput="SV.mvol=+this.value;save()" style="width:140px" aria-label="Music volume"></div><div class="set">Full screen${tg('fs')}</div><div class="set">Animations${tg('motion')}</div><div class="set">Easy mode (gentle crashes, more time)${tg('easy')}</div></div></div>`}
function render(){save();if(view=='garage'&&lastV!='garage')sfx('rev');lastV=view;
 if(view=='game'&&$('cv')){$('modal').innerHTML=showSet?settingsView():$('modal').innerHTML;return}
 let b='';const top=view!='splash'&&view!='game'?`<div class="top"><h2>${logo(46)} Turbo Rush</h2><div class="row"><span class="chip">${ic('coin')} $${SV.coins}</span>${view!='menu'?`<button class="btn ghost sm" onclick="home()">${ic('x')} Menu</button>`:''}<button class="btn ghost sm" onclick="toggleFS()" aria-label="Full screen">${ic('expand')} Full screen</button><button class="btn ghost sm" onclick="showSet=true;render()">${ic('gear')} Settings</button></div></div>`:'';
 if(view=='splash')b=splashView();
 else if(view=='menu')b=`<div class="fx"><span class="rd"></span><span class="ln"></span><span class="car">${logo(140)}</span>${[10,22,36,50,64,78].map((t,i)=>`<span class="sk" style="top:${t}%;animation-delay:${-i*.7}s;animation-duration:${1.6+i%3*.7}s"></span>`).join('')}</div>
<div class="hero">${logo(230)}<h1>Turbo Rush</h1><p class="tag" style="animation-delay:.15s">Drive, explore and have fun together.</p><p class="mut" style="animation-delay:.25s">A friendly open-city driving game. Easy to learn and fun for everyone.</p>
${[["view='stages';render()",'play','Play missions',''],['doHost()','wifi','Host a room',''],["view='join';render()",'users','Join a room',''],["view='garage';render()",'car','Garage',''],["view='scores';render();loadLB()",'trophy','Scores',''],["view='rules';render()",'book','How to play','ghost']].map(([f,i,t,g],k)=>`<button class="btn ${g}" style="animation-delay:${.3+k*.08}s" onclick="${f}">${ic(i)} ${t}</button>`).join('')}<p class="credit">Created by: Shubh Gaurav Jain</p></div>`;
 else if(view=='stages'){const maxShow=Math.max(20,Math.min(SV.stage+4,Math.ceil(SV.stage/20)*20+20));b=`<h2 style="text-align:center;margin-top:2vh">Choose a stage</h2>
<p class="mut" style="text-align:center">World: <b>${worldOf(SV.stage)}</b> · Highest unlocked: Stage ${SV.stage}</p>
<div class="row" style="justify-content:center;flex-wrap:wrap;gap:8px"><b>AI in races:</b>${[0,1,2].map(n=>`<button class="btn sm ${SV.ai==n?'':'ghost'}" onclick="SV.ai=${n};save();render()">${n}</button>`).join('')}<button class="btn sm ${SV.easy?'':'ghost'}" onclick="SV.easy=!SV.easy;save();render()">Easy: ${SV.easy?'ON':'OFF'}</button></div>
<div class="sg">${Array.from({length:maxShow},(_,i)=>{const st=i+1,lk=st>SV.stage,jobs=stageMissions(st);return`<button class="stc ${lk?'lock':''}" ${lk?'disabled':''} onclick="startLocalGame({mode:'story',stage:${st}})"><b>Stage ${st} <span class="heart" role="button" aria-label="Favourite stage" onclick="event.stopPropagation();favS(${st})">${SV.fav.s.includes(st)?'♥':'♡'}</span></b><span>${stageName(st)}</span><small>${jobs.map(t=>MT[t]).join(' · ')}</small>${lk?ic('lock'):ic('play')}</button>`}).join('')}</div>
<p class="mut" style="text-align:center;margin-top:10px">Stages repeat every 20 with a new world and harder jobs. Keep clearing to unlock more.</p>`}
 else if(view=='garage')b=garageView();else if(view=='scores')b=scoresView();
 else if(view=='rules')b=`<div class="card rl"><h2>${ic('book')} How to play</h2>${rulesBody()}<button class="btn" onclick="view='menu';render()">Back to menu</button></div>`;
 else if(view=='join')b=`<div class="card menu"><h2>Join a room</h2><p class="mut">Ask the host for their 4-digit code.</p><input id="jc" maxlength="4" inputmode="numeric" placeholder="4-digit code" value="${jc0}" style="font:700 28px 'Courier New',monospace;text-align:center;letter-spacing:8px"><input id="jn" maxlength="14" placeholder="Your name" value="${esc(jn0||SV.name)}"><button class="btn" onclick="doJoin()">${ic('wifi')} Join</button></div>`;
 else if(view=='lobby')b=lobbyView();
 if(view=='game'){$('app').innerHTML=`<canvas id="cv"></canvas><div class="gb"><button class="btn ghost sm" onclick="togglePause()">Pause</button><button class="btn ghost sm" onclick="toggleFS()" aria-label="Full screen">${ic('expand')} Full screen</button><button class="btn ghost sm" onclick="home()">${ic('x')} Exit</button></div><div class="tc"><div><button data-k="lf">◀</button><button data-k="rt">▶</button></div><div class="tr2"><button data-k="horn">📣</button><button data-k="nit">N</button><button data-k="dn">▼</button><button data-k="up">▲</button></div></div>`;
  CV=$('cv');CV.width=innerWidth;CV.height=innerHeight;let dr=null;CV.addEventListener('pointerdown',e=>{dr=e.clientX;CV.setPointerCapture&&CV.setPointerCapture(e.pointerId)});CV.addEventListener('pointermove',e=>{if(dr!=null){CAM.r+=(e.clientX-dr)*.008;dr=e.clientX}});['pointerup','pointercancel'].forEach(v=>CV.addEventListener(v,()=>{dr=null}));CV.addEventListener('dblclick',()=>{CAM.r=0;ZM=1});CV.addEventListener('wheel',e=>{e.preventDefault();ZM=cl(ZM*(e.deltaY>0?.92:1.08),.6,1.8)},{passive:false});
  document.querySelectorAll('.tc button').forEach(el=>{const k=el.dataset.k,on=e=>{e.preventDefault();TC[k]=1;if(k=='horn')sfx('horn')},off=e=>{e.preventDefault();TC[k]=0};el.addEventListener('pointerdown',on);['pointerup','pointerleave','pointercancel'].forEach(v=>el.addEventListener(v,off))})}
 else $('app').innerHTML=top+'<div class="wrap">'+b+'</div>';
 $('modal').innerHTML=showAbout?aboutView():showSet?settingsView():'';splashTimer();if(view=='garage')bindGarage()}

function logo(z){return`<svg class="logo" width="${z}" height="${Math.round(z*.4)}" viewBox="0 6 120 46" aria-hidden="true"><path d="M0 24h8M2 30h6M0 36h8" stroke="var(--ac2)" stroke-width="2.5" stroke-linecap="round" opacity=".7"/><path d="M10 36Q10 31 16 30L38 26 56 15Q59 13 63 13H82Q87 13 91 16L104 25 112 27Q118 29 118 34V37Q118 40 115 40H13Q10 40 10 37Z" fill="url(#lg)"/><path d="M58 17 44 26H70V16H60zM74 16V26H92L82 16z" fill="var(--bg)" opacity=".7"/><path d="M14 33H112" stroke="var(--text)" stroke-width="1.4" opacity=".55"/><path d="M8 27h14l-2 3H10zM14 30v3" fill="var(--ac2)" stroke="var(--ac2)" stroke-width="1.5"/><path d="M110 29l7 1.5v3l-7-.5z" fill="var(--e)"/><circle cx="30" cy="41" r="10" fill="var(--bg)"/><circle cx="97" cy="41" r="10" fill="var(--bg)"/><g class="wh"><circle cx="30" cy="41" r="7.5" fill="#0a0a0f" stroke="var(--text)" stroke-width="2"/><circle cx="30" cy="41" r="3.2" fill="var(--ac)"/><path d="M30 34v14M23 41h14" stroke="var(--text)" stroke-width="1.2"/></g><g class="wh"><circle cx="97" cy="41" r="7.5" fill="#0a0a0f" stroke="var(--text)" stroke-width="2"/><circle cx="97" cy="41" r="3.2" fill="var(--ac)"/><path d="M97 34v14M90 41h14" stroke="var(--text)" stroke-width="1.2"/></g></svg>`}
function toggleFS(){try{if(document.fullscreenElement)document.exitFullscreen();else{const r=document.documentElement.requestFullscreen();r&&r.catch&&r.catch(()=>toast('Full screen is not available here'))}}catch(e){toast('Full screen is not available here')}}
function loadPeer(){return window.Peer?Promise.resolve():new Promise((ok,no)=>{const e=document.createElement('script');e.src='https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js';e.onload=ok;e.onerror=no;document.head.appendChild(e)})}
const noNet=()=>toast('Could not reach the online connector. Check your internet and try again.');
function cloudHost(tries=0){loadPeer().then(()=>{
 const c=String(1000+rnd(9000)),peer=new Peer('turborush-'+c),conns={};
 net={onclose:null,close(){try{peer.destroy()}catch(e){}},send(str){const m=JSON.parse(str);if(m.t=='to')Object.values(conns).forEach(x=>x.open&&x.send({t:'msg',d:m.d}))}};
 peer.on('open',()=>onNet({t:'hosted',code:c}));
 peer.on('error',e=>{if(e.type=='unavailable-id'&&tries<8){peer.destroy();cloudHost(tries+1)}else noNet()});
 peer.on('connection',cn=>{
  cn.on('data',d=>{
   if(d.t=='join'){if(Object.keys(conns).length>=9){cn.send({t:'err',msg:'Room is full (10 players max)'});return}
    conns[cn.peer]=cn;cn.send({t:'joined',id:cn.peer});onNet({t:'joined',id:cn.peer,name:String(d.name||'Player').slice(0,14)})}
   else if(d.t=='m'&&conns[cn.peer])onNet({t:'msg',from:cn.peer,d:d.d})});
  cn.on('close',()=>{if(conns[cn.peer]){delete conns[cn.peer];onNet({t:'left',id:cn.peer})}})})
}).catch(noNet)}
function cloudJoin(c,name){loadPeer().then(()=>{
 const peer=new Peer();let cn;
 net={onclose:null,close(){try{peer.destroy()}catch(e){}},send(str){if(cn&&cn.open)cn.send(JSON.parse(str))}};
 peer.on('open',()=>{cn=peer.connect('turborush-'+c,{reliable:true});
  cn.on('open',()=>cn.send({t:'join',name}));
  cn.on('data',d=>onNet(d));
  cn.on('close',()=>{if(net&&view!='menu')onNet({t:'closed'})})});
 peer.on('error',e=>{if(e.type=='peer-unavailable')toast('No room with that code');else noNet();try{peer.destroy()}catch(x){}net=null})
}).catch(noNet)}
save();render();requestAnimationFrame(loop);setTimeout(cloudInit,400);
</script>
</body>
</html>
